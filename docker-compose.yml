# Entorno local completo de Platter v1:
#   http://localhost:8081/          Landing
#   http://localhost:8081/m/demo    Carta WebAR de la mesa demo
#   http://localhost:8081/api/v1    API (también directo en http://localhost:8080)
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: platter
      POSTGRES_USER: platter
      POSTGRES_PASSWORD: platter
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platter -d platter"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: jdbc:postgresql://postgres:5432/platter
      DATABASE_USER: platter
      DATABASE_PASSWORD: platter
      CACHE_TYPE: redis
      REDIS_HOST: redis
      REDIS_HEALTH: "true"
      PUBLIC_WEB_URL: ${PUBLIC_WEB_URL:-http://localhost:8081}
      JWT_SECRET: ${JWT_SECRET:-change-me-please-this-is-a-dev-only-secret-32b}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-2.5-flash}
    volumes:
      - storage-data:/data/storage
    ports:
      - "${BACKEND_PORT:-8080}:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  gateway:
    image: nginx:alpine
    volumes:
      - ./landing:/usr/share/nginx/html/landing:ro
      - ./webar:/usr/share/nginx/html/webar:ro
      - ./infra/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8081:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  storage-data:
