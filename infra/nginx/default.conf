# Platter · API Gateway / servidor web (imagen nginx:alpine)
#   /          → landing estática      (/usr/share/nginx/html/landing)
#   /m/{token} → app WebAR del comensal (/usr/share/nginx/html/webar, SPA)
#   /api/      → backend Spring Boot    (http://backend:8080)

# Si hay un túnel/terminador TLS delante (cloudflared, ALB), se respeta su esquema original para que el
# backend construya URLs https (glbUrl, photoUrl) y el navegador no las bloquee como contenido mixto.
# No se envía X-Forwarded-Port: el puerto público ya viaja en Host (ej. localhost:8081).
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# Tipos extra (se suman a /etc/nginx/mime.types incluido en nginx.conf).
types {
    model/gltf-binary glb;
    model/gltf+json   gltf;
    model/vnd.usdz+zip usdz;
}

server {
    listen 80;
    listen [::]:80;
    server_name _;

    charset utf-8;
    server_tokens off;
    absolute_redirect off;               # redirecciones relativas (el host publica en :8081)
    charset_types text/css text/plain application/javascript application/json image/svg+xml;

    # Compresión (los .glb ya van comprimidos con Draco; no se re-comprimen).
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 512;
    gzip_types text/plain text/css application/javascript text/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # DNS interno de Docker; con una variable en proxy_pass NGINX resuelve "backend"
    # en tiempo de petición (arranca aunque el backend aún no exista y sigue sus cambios de IP).
    resolver 127.0.0.11 valid=30s ipv6=off;
    resolver_timeout 5s;

    # ------------------------------------------------------------------ API
    location /api/ {
        set $platter_backend http://backend:8080;
        proxy_pass $platter_backend;            # sin URI: se reenvía la ruta original completa

        client_max_body_size 12m;               # fotos JPEG/PNG ≤ 10 MB + multipart
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;

        proxy_connect_timeout 5s;
        proxy_read_timeout 90s;                 # análisis con IA puede tardar
        proxy_send_timeout 90s;
        proxy_request_buffering on;
    }

    # Activos 3D y fotos: se respetan Cache-Control / ETag / 304 del backend
    # (no se agregan ni sobrescriben cabeceras de caché aquí).
    location /api/v1/assets/ {
        set $platter_backend http://backend:8080;
        proxy_pass $platter_backend;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host              $http_host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header X-Forwarded-Host  $http_host;
    }

    # ------------------------------------------------------- WebAR (comensal)
    location = /m {
        return 301 /m/;
    }

    location ^~ /m/ {
        alias /usr/share/nginx/html/webar/;
        index index.html;
        # /m/app.js, /m/styles.css → archivo; /m/{token} → index.html (SPA)
        try_files $uri /m/index.html;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /m/index.html {
        alias /usr/share/nginx/html/webar/index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ----------------------------------------------------------- Landing
    location / {
        root /usr/share/nginx/html/landing;
        index index.html;
        try_files $uri $uri/ =404;
        add_header Cache-Control "public, max-age=300" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    location = /index.html {
        root /usr/share/nginx/html/landing;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options "nosniff" always;
    }
}
