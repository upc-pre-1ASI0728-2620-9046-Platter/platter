spring:
  application:
    name: platter-backend
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/platter}
    username: ${DATABASE_USER:platter}
    password: ${DATABASE_PASSWORD:platter}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  flyway:
    enabled: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 11MB
  cache:
    type: ${CACHE_TYPE:simple}
    cache-names: activeMenu
    redis:
      time-to-live: 10m
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  port: ${PORT:8080}
  forward-headers-strategy: framework
  compression:
    enabled: true
    mime-types: application/json,model/gltf-binary

management:
  endpoints:
    web:
      exposure:
        include: health,info
  health:
    redis:
      enabled: ${REDIS_HEALTH:false}

platter:
  public-web-url: ${PUBLIC_WEB_URL:http://localhost:8081}
  jwt:
    secret: ${JWT_SECRET:change-me-please-this-is-a-dev-only-secret-32b}
    ttl: 1h
  storage:
    local-dir: ${STORAGE_DIR:./data/storage}
    s3:
      bucket: ${S3_BUCKET:}
      endpoint: ${S3_ENDPOINT:}
      region: ${S3_REGION:us-east-1}
      access-key: ${S3_ACCESS_KEY:}
      secret-key: ${S3_SECRET_KEY:}
  ai:
    api-key: ${GEMINI_API_KEY:}
    model: ${GEMINI_MODEL:gemini-2.5-flash}
    timeout: 5000ms
    low-confidence-threshold: 0.5
  demo:
    enabled: ${DEMO_DATA:true}
